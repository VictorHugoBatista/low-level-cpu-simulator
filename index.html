<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Sem Referer em requisição nenhuma: a SomaFM aplica proteção contra hotlink
         por Referer e devolve 403 para origens externas — inclusive este site no
         github.io. Sem Referer, os espelhos respondem 200/206. (O widget do github
         e os links externos não dependem dele.) -->
    <meta name="referrer" content="no-referrer" />
    <title>MOS-6502 — Simulador de CPU de 8 bits</title>
    <script>
      // As chaves de tema e CRT também são definidas em src/web/app.tsx (THEME_KEY e CRT_KEY).
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("ak8-theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.crt =
          localStorage.getItem("ak8-crt") === "off" ? "off" : "on";
      } catch {
        /* sem localStorage: ficam nos padrões (escuro, CRT ligado) */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
